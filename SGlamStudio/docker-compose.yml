services:
  postgres:
    image: postgres:15-alpine
    container_name: glamstudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glamstudio
      POSTGRES_USER: glamstudio
      POSTGRES_PASSWORD: glamstudio
    ports:
      - "5432:5432"
    volumes:
      - glamstudio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glamstudio -d glamstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glamstudio_postgres_data:
